document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;background:rgba(0,0,0,.4);color:#fff;display:flex;font-size:1.4em;inset:0;justify-content:center;line-height:1.2;opacity:0;padding:1rem;pointer-events:none;position:absolute;transition:opacity 1s ease 1s;z-index:99999}.maplibregl-cooperative-gesture-screen.maplibregl-show{opacity:1;transition:opacity .05s}.maplibregl-cooperative-gesture-screen .maplibregl-mobile-message{display:none}@media (hover:none),(width <= 480px){.maplibregl-cooperative-gesture-screen .maplibregl-desktop-message{display:none}.maplibregl-cooperative-gesture-screen .maplibregl-mobile-message{display:block}}.maplibregl-pseudo-fullscreen{height:100%!important;left:0!important;position:fixed!important;top:0!important;width:100%!important;z-index:99999}</style>\n<script src=\"224ef570-22a5-4652-8f0d-bcebd503c676\"><\/script>\n<style>\n  /* En familj överallt. Instrument Sans ligger kvar i bundlen som reserv om\n     Google Fonts inte svarar. */\n  :root {\n    --ui: 'Bricolage Grotesque', 'Instrument Sans', ui-sans-serif, system-ui,\n          -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif;\n    --ink: #14120f;\n    --mute: #6b6357;\n    --line: #ddd4c2;\n    --rost: #b4451f;\n  }\n  body { margin: 0; background: #f4efe4; color: var(--ink); font-family: var(--ui); -webkit-text-size-adjust: 100%; }\n  * { box-sizing: border-box; }\n  a { color: var(--rost); }\n  a:hover { color: #8e3415; }\n  /* Separatorn skulle annars bli ensam kvar sist på raden när metaraden bryts. */\n  @media (max-width: 640px) { .hero-sep { display: none; } }\n  :focus-visible { outline: 2px solid var(--rost); outline-offset: 3px; border-radius: 2px; }\n  ::selection { background: var(--rost); color: #f4efe4; }\n</style>\n</helmet>\n\n<div style=\"background: #f4efe4; color: var(--ink); font: 400 17px/1.65 var(--ui); min-height: 100vh; overflow-x: hidden;\">\n\n<sc-if value=\"{{ past }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem; text-align: center;\">\n    <p style=\"margin: 0; font-weight: 600; font-size: clamp(1.35rem, 5vw, 2rem); line-height: 1.25; letter-spacing: -0.025em; text-wrap: balance;\">Ingen vardagskub planerad &#228;n.</p>\n  </div>\n</sc-if>\n\n<sc-if value=\"{{ upcoming }}\" hint-placeholder-val=\"{{ true }}\">\n  <header style=\"position: relative; min-height: 60vh; display: flex; flex-direction: column; justify-content: flex-end; background: #14120f; overflow: hidden;\">\n    <sc-if value=\"{{ loaded }}\" hint-placeholder-val=\"{{ false }}\">\n      <img src=\"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==\" ref=\"{{ heroRef }}\" alt=\"\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;\">\n    </sc-if>\n    <div style=\"position: absolute; inset: 0; background: linear-gradient(178deg, rgba(20,18,15,0.55) 0%, rgba(20,18,15,0.05) 38%, rgba(20,18,15,0.70) 76%, rgba(20,18,15,0.95) 100%);\"></div>\n    <div style=\"position: absolute; top: 0.85rem; right: 1.25rem; max-width: 62%; text-align: right; font-size: 0.72rem; line-height: 1.4; color: rgba(222,213,195,0.5); text-shadow: 0 1px 3px rgba(20,18,15,0.65);\">{{ heroCredit }}</div>\n    <div style=\"position: relative; width: 100%; max-width: 46rem; margin: 0 auto; padding: 5rem 1.5rem 2rem; display: flex; flex-direction: column; gap: 0.2rem;\">\n      <div style=\"display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1.1rem 1.5rem;\">\n        <h1 style=\"flex: 1 1 12rem; font-weight: 600; font-size: clamp(2.3rem, 8vw, 4rem); line-height: 1.02; letter-spacing: -0.035em; margin: 0; color: #f7f2e7; text-wrap: balance; opacity: {{ nameFade }}; transition: opacity 260ms ease;\"><a href=\"{{ cubeUrl }}\" target=\"_blank\" rel=\"noreferrer\" style=\"color: inherit; text-decoration: none;\" style-hover=\"text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 8px; text-decoration-color: rgba(224,139,92,0.55);\">{{ cubeName }}</a></h1>\n        <div style=\"flex: 0 0 auto; display: flex; align-items: center; line-height: 0; font-size: clamp(2.3rem, 8vw, 4rem); transform: translateY(0.1em);\">\n          <sc-if value=\"{{ canSignUp }}\" hint-placeholder-val=\"{{ true }}\">\n            <a href=\"{{ swishUrl }}\" target=\"_blank\" rel=\"noreferrer\" style=\"display: inline-flex; align-items: center; gap: 0.5rem; background: var(--rost); color: #fff7ee; font-weight: 600; font-size: 0.95rem; text-decoration: none; padding: 0.6rem 1.2rem; min-height: 2.7rem; border-radius: 999px; transition: background 180ms ease;\" style-hover=\"background: #c9522a; color: #fff;\">Anm&#228;lan via Swish <span aria-hidden=\"true\">&#8599;</span></a>\n          </sc-if>\n          <sc-if value=\"{{ full }}\" hint-placeholder-val=\"{{ false }}\">\n            <span aria-disabled=\"true\" style=\"display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(247,242,231,0.1); color: rgba(247,242,231,0.55); border: 1px solid rgba(247,242,231,0.18); font-weight: 600; font-size: 0.95rem; padding: 0.6rem 1.2rem; min-height: 2.7rem; border-radius: 999px; cursor: default;\">Anm&#228;lan st&#228;ngd, fullt lag</span>\n          </sc-if>\n        </div>\n      </div>\n      <div class=\"hero-meta\" style=\"display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.1rem 0.7rem; font-size: clamp(1rem, 2.2vw, 1.1rem); color: #ded5c3;\">\n        <span>Vardagskub hos oskar</span>\n        <span class=\"hero-sep\" aria-hidden=\"true\" style=\"color: #7d7566;\">&#183;</span>\n        <span style=\"white-space: nowrap;\">{{ eventDate }} <span aria-hidden=\"true\" style=\"color: #7d7566;\">&#183;</span> {{ eventTime }}</span>\n      </div>\n    </div>\n  </header>\n\n  <main style=\"max-width: 46rem; margin: 0 auto; padding: clamp(2.25rem, 6vw, 3.25rem) 1.5rem 0;\">\n    <div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(min(200px, 100%), 1fr)); gap: 1.5rem 2.2rem;\">\n      <sc-for list=\"{{ infos }}\" as=\"item\" hint-placeholder-count=\"3\">\n        <div>\n          <div style=\"font-weight: 600; font-size: 1.05rem; line-height: 1.35; letter-spacing: -0.012em;\">{{ item.fact }}</div>\n          <div style=\"margin-top: 0.3rem; font-size: 0.95rem; line-height: 1.5; color: var(--mute); text-wrap: pretty;\">{{ item.note }}</div>\n        </div>\n      </sc-for>\n    </div>\n  </main>\n\n  <section style=\"max-width: 46rem; margin: 0 auto; padding: clamp(2rem, 5vw, 2.75rem) 1.5rem clamp(1.75rem, 4vw, 2.5rem);\">\n    <div style=\"border-top: 1px solid var(--line); padding-top: clamp(1.6rem, 4vw, 2.1rem); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(255px, 100%), 1fr)); gap: 1.4rem 2.2rem; align-items: start;\">\n      <div>\n        <h2 style=\"font-weight: 600; font-size: 1.25rem; line-height: 1.2; letter-spacing: -0.02em; margin: 0 0 0.55rem;\">Hitta hit</h2>\n        <p style=\"margin: 0;\">{{ street }}<br>{{ city }}</p>\n        <p style=\"margin: 0.45rem 0 0; color: var(--mute);\">{{ whenCap }}. Draften drar i g&#229;ng {{ draftTime }}.</p>\n        <a href=\"{{ mapLink }}\" target=\"{{ mapTarget }}\" rel=\"noreferrer\" style=\"margin-top: 1rem; align-self: flex-start; display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.92rem; text-decoration: none; padding: 0.55rem 1rem; min-height: 2.6rem; border: 1px solid var(--line); border-radius: 999px; background: #fbf8f1; transition: border-color 180ms ease, background 180ms ease;\" style-hover=\"border-color: var(--rost); background: #fff;\">{{ mapLabel }} <span aria-hidden=\"true\">&#8599;</span></a>\n      </div>\n      <div style=\"position: relative; width: 100%; max-width: 100%; aspect-ratio: 4 / 3; min-height: 220px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: #e9e2d3;\">\n        <div ref=\"{{ mapRef }}\" style=\"position: absolute; inset: 0;\"></div>\n      </div>\n    </div>\n  </section>\n\n  <section style=\"position: relative; padding: 0 1.5rem;\">\n    <div style=\"--cw: min(216px, calc((min(100vw, 58rem) - 5rem) / {{ fanSpan }})); position: relative; width: 100%; display: flex; justify-content: center; align-items: flex-start; height: calc(var(--cw) * 1.32); padding-top: calc(var(--cw) * 0.16); overflow: hidden;\">\n      <sc-for list=\"{{ fan }}\" as=\"card\" hint-placeholder-count=\"0\">\n        <img src=\"data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==\" ref=\"{{ card.imgRef }}\" alt=\"\" title=\"{{ card.name }}\" style=\"width: var(--cw); margin: 0 calc(var(--cw) * -0.205); transform: rotate({{ card.rot }}deg) translateY(calc(var(--cw) * {{ card.dy }})); border-radius: calc(var(--cw) * 0.051); box-shadow: 0 22px 38px -24px rgba(20,18,15,0.6); flex-shrink: 0; transition: transform 340ms cubic-bezier(0.2,0.75,0.2,1), box-shadow 340ms ease; will-change: transform;\" style-hover=\"transform: rotate(0deg) translateY(calc(var(--cw) * -0.08)) scale(1.09); z-index: 5; box-shadow: 0 34px 50px -22px rgba(20,18,15,0.65);\">\n      </sc-for>\n    </div>\n    <sc-if value=\"{{ hasCubeName }}\" hint-placeholder-val=\"{{ true }}\">\n      <a href=\"{{ cubeUrl }}\" target=\"_blank\" rel=\"noreferrer\" style=\"position: absolute; left: 1.5rem; bottom: 0.7rem; z-index: 20; display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; line-height: 1; padding: 0.5rem 0.85rem; border-radius: 999px; text-decoration: none; color: var(--mute); background: rgba(244,239,228,0.8); border: 1px solid rgba(20,18,15,0.09); -webkit-backdrop-filter: blur(7px); backdrop-filter: blur(7px); transition: color 180ms ease, background 180ms ease, transform 180ms ease, box-shadow 180ms ease;\" style-hover=\"color: var(--rost); background: rgba(255,255,255,0.96); transform: translateY(-2px); box-shadow: 0 6px 16px -8px rgba(20,18,15,0.5);\">Kort ur {{ cubeName }} <span aria-hidden=\"true\">&#8599;</span></a>\n    </sc-if>\n  </section>\n</sc-if>\n\n</div>\n\n</x-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;cubeId&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;downward-spiral&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Kub&quot;},&quot;cardSource&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Kubens primer&quot;,&quot;Högst elo&quot;,&quot;Slumpat&quot;],&quot;default&quot;:&quot;Kubens primer&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Kub&quot;},&quot;fanCount&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:3,&quot;max&quot;:9,&quot;step&quot;:2,&quot;default&quot;:7,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Kub&quot;},&quot;address&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Kilian Zollsgatan 27A, Malmö&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Plats&quot;},&quot;lat&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;55.599143&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Plats&quot;},&quot;lon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;12.974382&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Plats&quot;}}\">\nclass Component extends DCLogic {\n  state = { cube: null, error: null, geo: null, name: this.readName() };\n\n  // ══ Inför nästa kub: allt som brukar ändras står här ══════════════════\n  // Sista biten av kubens Cube Cobra-adress. Styr rubrik, omslagsbild och\n  // vilka kort som hamnar i solfjädern — inget annat behöver röras.\n  get cubeId() { return this.props.cubeId || \"downward-spiral\"; }\n  // Vilka kort solfjädern visar: \"Kubens primer\" | \"Högst elo\" | \"Slumpat\".\n  get cardSource() { return this.props.cardSource || \"Kubens primer\"; }\n  // Antal kort i solfjädern (klamras till 3–9).\n  get fanCount() { return Number(this.props.fanCount) || 7; }\n\n  get eventDate() { return \"torsdag 10 september\"; }\n  get eventTime() { return \"17:30\"; }\n  get draftTime() { return \"18:00\"; }\n  // Från och med det här klockslaget (lokal tid) visar sidan bara\n  // \"Ingen vardagskub planerad än\". Håll det en dag efter eventDate.\n  get eventOver() { return \"2026-09-11T00:00:00\"; }\n\n  // Sätt till true när laget är fullt: knappen blir \"Fullt lag\" och slutar\n  // länka till Swish.\n  get full() { return false; }\n\n  get street() { return \"Kilian Zollsgatan 27A, lgh 1201\"; }\n  get city() { return \"Malmö\"; }\n  // Utan lägenhetsnummer — den här strängen är vad kartan slår upp.\n  get address() { return this.props.address || \"Kilian Zollsgatan 27A, Malmö\"; }\n\n  get swishUrl() { return \"https://app.swish.nu/1/p/sw/?sw=0708771335&amt=35&cur=SEK&msg=Inga%20matpreferenser&edit=msg&src=qr\"; }\n  // ═════════════════════════════════════════════════════════════════════\n\n  componentDidMount() { this.load(); this.locate(); }\n  componentDidUpdate(prev) {\n    if (prev.cubeId !== this.props.cubeId) { this.setState({ cube: null, name: this.readName() }); this.load(); }\n    if (prev.address !== this.props.address || prev.lat !== this.props.lat || prev.lon !== this.props.lon) {\n      if (this.map) { this.map.remove(); this.map = null; }\n      this.locate();\n    }\n  }\n\n  // Kubens namn kommer från Cube Cobra och finns alltså inte vid första\n  // målningen. Ett påhittat platshållarnamn hann blinka förbi varje gång, så\n  // vi minns istället förra besökets namn och låter rubriken vara tom (men\n  // lika hög) tills vi vet något — se cubeName i renderVals.\n  nameKey() { return \"kub:cubeName:\" + this.cubeId; }\n  readName() { try { return localStorage.getItem(this.nameKey()) || \"\"; } catch (e) { return \"\"; } }\n  saveName(name) { try { if (name) localStorage.setItem(this.nameKey(), name); } catch (e) { /* privat läge */ } }\n\n  async load() {\n    try {\n      const r = await fetch(\"https://cubecobra.com/cube/api/cubeJSON/\" + this.cubeId);\n      if (!r.ok) throw new Error(\"status \" + r.status);\n      const cube = await r.json();\n      this.saveName(cube && cube.name);\n      this.setState({ cube, error: null });\n    } catch (e) { this.setState({ error: e.message }); }\n  }\n\n  async locate() {\n    const lat = Number(this.props.lat ?? 55.599143), lon = Number(this.props.lon ?? 12.974382);\n    if (lat && lon) { this.setState({ geo: { lat, lon } }, () => this.drawMap()); return; }\n    try {\n      const url = \"https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=5&q=\" + encodeURIComponent(this.address);\n      const r = await fetch(url, { headers: { \"Accept\": \"application/json\" } });\n      const j = await r.json();\n      const list = Array.isArray(j) ? j : [];\n      const hit = list.find(x => x.address && x.address.house_number) || list[0];\n      if (hit) this.setState({ geo: { lat: Number(hit.lat), lon: Number(hit.lon) } }, () => this.drawMap());\n    } catch (e) { /* kartan hoppas över om uppslaget misslyckas */ }\n  }\n\n  drawMap() {\n    const geo = this.state.geo;\n    if (!geo || !this.mapEl || !window.maplibregl || this.map) return;\n    const map = new window.maplibregl.Map({\n      container: this.mapEl,\n      style: \"https://tiles.openfreemap.org/styles/positron\",\n      center: [geo.lon, geo.lat],\n      // Utzoomad till hela Malmö: kvartersnivå säger inget till den som inte\n      // redan vet var Slottsstaden ligger. Gatunivån finns i \"Öppna i kartan\".\n      zoom: 11.3,\n      attributionControl: { compact: true },\n      scrollZoom: false\n    });\n    const pin = document.createElement(\"div\");\n    pin.style.cssText = \"width:16px;height:16px;border-radius:50%;background:#b4451f;border:3px solid #fbf8f1;box-shadow:0 2px 10px rgba(20,18,15,0.45)\";\n    new window.maplibregl.Marker({ element: pin }).setLngLat([geo.lon, geo.lat]).addTo(map);\n    this.map = map;\n  }\n\n  cards() {\n    const cube = this.state.cube;\n    if (!cube) return [];\n    const all = (cube.cards && cube.cards.mainboard || []).map(c => c.details).filter(Boolean);\n    const source = this.cardSource;\n    if (source === \"Slumpat\") {\n      const a = [...all];\n      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }\n      return a;\n    }\n    const byElo = [...all].sort((a, b) => (b.elo || 0) - (a.elo || 0));\n    if (source === \"Högst elo\") return byElo;\n    const names = [...String(cube.description || \"\").matchAll(/\\[\\[!?([^\\]|]+)\\]\\]/g)].map(m => m[1].trim().toLowerCase());\n    const seen = new Set(), picked = [];\n    for (const n of names) {\n      if (seen.has(n)) continue;\n      const hit = all.find(c => c.name_lower === n);\n      if (hit) { seen.add(n); picked.push(hit); }\n    }\n    return picked.concat(byElo.filter(c => !seen.has(c.name_lower)));\n  }\n\n  // Vi vill landa i telefonens egen kartapp, inte i en webbkarta: geo: låter\n  // Android visa appväljaren, och maps.apple.com öppnar Kartor direkt på iOS.\n  // Desktop saknar motsvarighet och får OSM i en ny flik som tidigare.\n  mapTarget() {\n    const geo = this.state.geo;\n    const q = encodeURIComponent(this.address);\n    // Desktop har ingen kartapp att lämna över till — där stannar vi i\n    // webbläsaren, och då ska knappen inte påstå något annat.\n    const web = { label: \"Se på karta\", target: \"_blank\" };\n    if (!geo) return Object.assign({ href: \"https://www.openstreetmap.org/search?query=\" + q }, web);\n    const ll = geo.lat + \",\" + geo.lon;\n    const ua = navigator.userAgent || \"\";\n    // Intenten tar över sidan, så en ny flik skulle bara bli en tom kvarleva.\n    if (/Android/i.test(ua)) {\n      return { href: \"geo:\" + ll + \"?q=\" + ll + \"(\" + q + \")\", target: \"_self\", label: \"Öppna i din kart-app\" };\n    }\n    const iOS = /iPhone|iPad|iPod/i.test(ua) ||\n      (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1); // iPad ljuger om sin ua\n    if (iOS) {\n      return { href: \"https://maps.apple.com/?ll=\" + ll + \"&q=\" + q, target: \"_blank\", label: \"Öppna i din kart-app\" };\n    }\n    return Object.assign({\n      href: \"https://www.openstreetmap.org/?mlat=\" + geo.lat + \"&mlon=\" + geo.lon + \"#map=18/\" + geo.lat + \"/\" + geo.lon\n    }, web);\n  }\n\n  renderVals() {\n    const cube = this.state.cube;\n    const picks = this.cards();\n\n    const infos = [\n      { fact: \"Best of 2, ad-hoc pairings\",\n        note: \"Så många rundor man hinner och vill, draw istället för ett game 3.\" },\n      { fact: \"4–10 spelare\",\n        note: \"Vi justerar packstorlek och antal packs efter hur många som kommer.\" },\n      { fact: \"Mat ingår; 35kr anmälan.\",\n        note: \"Ät när det passar under kvällen. Skriv ev. matpref i meddelandet.\" }\n    ];\n\n    const count = Math.max(3, Math.min(9, this.fanCount));\n    const setSrc = url => el => { if (el && url && el.src !== url) el.src = url; };\n\n    const fanCards = picks.slice(0, count);\n    const mid = (fanCards.length - 1) / 2;\n    const fan = fanCards.map((c, i) => {\n      const d = i - mid;\n      return {\n        imgRef: setSrc(c.image_normal),\n        name: c.name + \" — \" + c.artist,\n        rot: (d * 4).toFixed(2),\n        // Andelar av kortbredden, så att solfjädern skalar med --cw på mobil.\n        dy: (Math.abs(d) * 0.06).toFixed(3)\n      };\n    });\n    // Solfjäderns bredd mätt i kortbredder (korten överlappar 0.41 av en bredd).\n    const fanSpan = Math.max(1, count - (count - 1) * 0.41).toFixed(2);\n\n    const heroCard = cube && cube.image;\n    const map = this.mapTarget();\n    const cubeName = (cube && cube.name) || this.state.name || \"\";\n    const past = Date.now() >= new Date(this.eventOver).getTime();\n    const when = this.eventDate + \", \" + this.eventTime;\n\n    return {\n      past,\n      upcoming: !past,\n      full: this.full,\n      canSignUp: !this.full,\n      swishUrl: this.swishUrl,\n      eventDate: this.eventDate,\n      eventTime: this.eventTime,\n      draftTime: this.draftTime,\n      street: this.street,\n      city: this.city,\n      whenCap: when.charAt(0).toUpperCase() + when.slice(1),\n      loaded: !!(heroCard && heroCard.uri),\n      infos,\n      fan,\n      fanSpan,\n      heroRef: setSrc(heroCard && heroCard.uri),\n      // Hårt mellanslag istället för namn: rubriken håller sin höjd utan att\n      // påstå något, så inget fel namn hinner blinka förbi.\n      cubeName: cubeName || \"\\u00a0\",\n      hasCubeName: !!cubeName,\n      nameFade: cubeName ? 1 : 0,\n      cubeUrl: \"https://cubecobra.com/cube/about/\" + this.cubeId + \"?view=primer\",\n      heroCredit: heroCard ? \"Omslag: \" + heroCard.imageName.replace(/\\s*\\[[^\\]]*\\]/, \"\") + \". Konst av \" + heroCard.artist : \"\",\n      mapRef: el => { this.mapEl = el; this.drawMap(); },\n      mapLink: map.href,\n      mapTarget: map.target,\n      mapLabel: map.label\n    };\n  }\n}\n\n<\/script>\n\n\n</body></html>"
  </script>
